# FairFed Risk - Baseline Experiments Configuration
experiment_name: baselines_centralized_vs_local

dataset:
  raw_dir: data/raw
  test_size: 0.20
  random_seed: 42

model:
  input_dim: 7
  hidden_dim1: 64
  hidden_dim2: 32
  dropout1: 0.2
  dropout2: 0.1

training:
  epochs: 40
  batch_size: 32
  learning_rate: 0.003
  weight_decay: 0.0001
  device: cpu

evaluation:
  threshold: 0.5
  output_dir: results/metrics
